<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Overlaps Fix Test</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 400px;
            z-index: 9999;
        }
        .test-result {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .success {
            background: rgba(0,255,0,0.2);
            border: 1px solid green;
        }
        .error {
            background: rgba(255,0,0,0.2);
            border: 1px solid red;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="test-panel">
        <h3>🔧 Header Overlaps Fix Test</h3>
        <button onclick="testZIndexFixes()">Test Z-Index Fixes</button>
        <button onclick="testTooltipFix()">Test Tooltip Fix</button>
        <button onclick="testDesignTokens()">Test Design Tokens</button>
        <div id="results"></div>
    </div>

    <script>
        function testZIndexFixes() {
            const results = [];
            
            // Test 1: Check if tooltip uses layer-toast instead of z-[100]
            const tooltipElements = document.querySelectorAll('[class*="layer-toast"]');
            if (tooltipElements.length > 0) {
                results.push({
                    test: 'Tooltip Z-Index Fix',
                    status: 'success',
                    message: `Found ${tooltipElements.length} elements using layer-toast`
                });
            } else {
                results.push({
                    test: 'Tooltip Z-Index Fix',
                    status: 'error',
                    message: 'No elements found using layer-toast class'
                });
            }
            
            // Test 2: Check for remaining z-[100] usage
            const highZElements = document.querySelectorAll('[class*="z-[100]"]');
            if (highZElements.length === 0) {
                results.push({
                    test: 'High Z-Index Cleanup',
                    status: 'success',
                    message: 'No z-[100] elements found'
                });
            } else {
                results.push({
                    test: 'High Z-Index Cleanup',
                    status: 'error',
                    message: `Found ${highZElements.length} elements still using z-[100]`
                });
            }
            
            // Test 3: Check for z-[9999] usage
            const extremeZElements = document.querySelectorAll('[class*="z-[9999]"]');
            if (extremeZElements.length === 0) {
                results.push({
                    test: 'Extreme Z-Index Cleanup',
                    status: 'success',
                    message: 'No z-[9999] elements found'
                });
            } else {
                results.push({
                    test: 'Extreme Z-Index Cleanup',
                    status: 'error',
                    message: `Found ${extremeZElements.length} elements still using z-[9999]`
                });
            }
            
            displayResults(results);
        }
        
        function testTooltipFix() {
            const results = [];
            
            // Check CSS custom properties for z-index tokens
            const rootStyles = getComputedStyle(document.documentElement);
            const zTooltip = rootStyles.getPropertyValue('--z-tooltip').trim();
            const zToast = rootStyles.getPropertyValue('--z-toast').trim();
            
            if (zToast) {
                results.push({
                    test: 'Z-Toast Token',
                    status: 'success',
                    message: `--z-toast: ${zToast}`
                });
            } else {
                results.push({
                    test: 'Z-Toast Token',
                    status: 'error',
                    message: '--z-toast token not found'
                });
            }
            
            displayResults(results);
        }
        
        function testDesignTokens() {
            const results = [];
            const rootStyles = getComputedStyle(document.documentElement);
            
            const tokens = [
                '--z-header',
                '--z-nav', 
                '--z-popover',
                '--z-modal',
                '--z-toast'
            ];
            
            tokens.forEach(token => {
                const value = rootStyles.getPropertyValue(token).trim();
                if (value) {
                    results.push({
                        test: `Token ${token}`,
                        status: 'success',
                        message: `${token}: ${value}`
                    });
                } else {
                    results.push({
                        test: `Token ${token}`,
                        status: 'error',
                        message: `${token} not found`
                    });
                }
            });
            
            displayResults(results);
        }
        
        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            let html = '';
            
            results.forEach(result => {
                html += `
                    <div class="test-result ${result.status}">
                        <strong>${result.test}:</strong><br>
                        ${result.message}
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        // Auto-run basic test on load
        window.addEventListener('load', () => {
            setTimeout(testZIndexFixes, 1000);
        });
    </script>
</body>
</html>
