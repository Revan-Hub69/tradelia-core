name: PR Quality Checks - Tradelia 2026

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # CORE: Build & Type Check (must pass)
  # ============================================
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: Build application
        run: npm run build

  # ============================================
  # LINT: ESLint (warnings allowed, errors fail)
  # ============================================
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Allow warnings while fixing legacy issues

  # ============================================
  # ARCHITECTURE: Circular deps & boundaries
  # ============================================
  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check circular dependencies
        run: npm run check:deps
        continue-on-error: true  # Report but don't fail while fixing

  # ============================================
  # TESTS: Unit tests with Vitest
  # ============================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        continue-on-error: true  # Report but don't fail while tests are being added

  # ============================================
  # SECURITY: npm audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't fail on moderate issues

  # ============================================
  # I18N: Translation completeness
  # ============================================
  i18n:
    name: Translation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check translation completeness
        run: |
          node -e "
            const fs = require('fs');
            
            function getKeys(obj, prefix = '') {
              let keys = [];
              for (const [key, value] of Object.entries(obj)) {
                const fullKey = prefix ? \`\${prefix}.\${key}\` : key;
                if (typeof value === 'object' && value !== null) {
                  keys.push(...getKeys(value, fullKey));
                } else {
                  keys.push(fullKey);
                }
              }
              return keys;
            }
            
            // Use flat file structure: messages/it.json, messages/en.json
            const itMessages = JSON.parse(fs.readFileSync('./messages/it.json', 'utf8'));
            const enMessages = JSON.parse(fs.readFileSync('./messages/en.json', 'utf8'));
            
            const itKeys = getKeys(itMessages);
            const enKeys = getKeys(enMessages);
            
            const missingInEn = itKeys.filter(key => !enKeys.includes(key));
            const missingInIt = enKeys.filter(key => !itKeys.includes(key));
            
            if (missingInEn.length > 0) {
              console.log('⚠️  Keys in IT but missing in EN:', missingInEn.slice(0, 10));
              if (missingInEn.length > 10) console.log('   ... and', missingInEn.length - 10, 'more');
            }
            
            if (missingInIt.length > 0) {
              console.log('⚠️  Keys in EN but missing in IT:', missingInIt.slice(0, 10));
              if (missingInIt.length > 10) console.log('   ... and', missingInIt.length - 10, 'more');
            }
            
            if (missingInEn.length === 0 && missingInIt.length === 0) {
              console.log('✅ All translations complete');
            } else {
              console.log('⚠️  Translation gaps found (not blocking)');
            }
          "
        continue-on-error: true  # Report but don't fail

  # ============================================
  # LIGHTHOUSE: Performance & Accessibility
  # ============================================
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for application
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true  # Report scores but don't fail build

  # ============================================
  # SUMMARY: Quality gate (only build must pass)
  # ============================================
  summary:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed - this must pass before merging"
            exit 1
          fi
          
          echo "✅ Build passed - PR can be merged"
          echo ""
          echo "Note: Other checks (lint, tests, lighthouse) are informational."
          echo "Fix issues when possible, but they won't block the merge."
