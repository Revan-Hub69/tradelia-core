# LIGHTHOUSE CI WORKFLOW - PHASE 3C IMPLEMENTATION
#
# Tier 1 Research Implementation:
# - Google Chrome Lighthouse CI Official
# - Automated performance monitoring
# - Performance regression detection
# - PR comments with results
#
# Expected Impact: Automated performance monitoring in CI/CD

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          SKIP_I18N_VALIDATION: true

      - name: Start application
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const resultsPath = '.lighthouseci';
              if (fs.existsSync(resultsPath)) {
                const files = fs.readdirSync(resultsPath);
                const manifestFile = files.find(f => f.includes('manifest.json'));
                
                if (manifestFile) {
                  const manifest = JSON.parse(fs.readFileSync(path.join(resultsPath, manifestFile), 'utf8'));
                  
                  let comment = '## 🚨 Lighthouse CI Results\n\n';
                  
                  manifest.forEach((result, index) => {
                    const { lhr } = result;
                    const { categories, audits } = lhr;
                    
                    comment += `### 📊 Report ${index + 1}: ${lhr.finalUrl}\n\n`;
                    comment += `| Category | Score |\n`;
                    comment += `|----------|-------|\n`;
                    comment += `| Performance | ${Math.round(categories.performance.score * 100)} |\n`;
                    comment += `| Accessibility | ${Math.round(categories.accessibility.score * 100)} |\n`;
                    comment += `| Best Practices | ${Math.round(categories['best-practices'].score * 100)} |\n`;
                    comment += `| SEO | ${Math.round(categories.seo.score * 100)} |\n\n`;
                    
                    // Core Web Vitals
                    comment += `#### Core Web Vitals\n`;
                    comment += `- **FCP**: ${Math.round(audits['first-contentful-paint'].numericValue)}ms\n`;
                    comment += `- **LCP**: ${Math.round(audits['largest-contentful-paint'].numericValue)}ms\n`;
                    comment += `- **CLS**: ${audits['cumulative-layout-shift'].numericValue.toFixed(3)}\n`;
                    comment += `- **TBT**: ${Math.round(audits['total-blocking-time'].numericValue)}ms\n\n`;
                  });
                  
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: comment
                  });
                }
              }
            } catch (error) {
              console.log('Could not post Lighthouse results:', error);
            }