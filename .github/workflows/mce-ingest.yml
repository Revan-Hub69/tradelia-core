name: MCE Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      health_check:
        description: "Run health check only"
        required: false
        default: false
        type: boolean
      verbose:
        description: "Enable verbose logging"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mce-pipeline
  cancel-in-progress: false

jobs:
  mce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev --no-fund --no-audit

      - name: Run MCE pipeline
        env:
          BINANCE_API_URL: https://data-api.binance.vision
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CMD="npx tsx scripts/prod/mce-pipeline.ts"

          if [ "${{ github.event.inputs.health_check || 'false' }}" = "true" ]; then
            CMD="$CMD --health"
          fi

          if [ "${{ github.event.inputs.verbose || 'false' }}" = "true" ]; then
            CMD="$CMD --verbose"
          fi

          echo "Running: $CMD"
          $CMD
