name: Production Pipeline Execution

on:
  schedule:
    # Run every 5 minutes for real-time market context updates
    # This is the minimum interval supported by GitHub Actions
    - cron: '*/5 * * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run'
        required: true
        default: 'both'
        type: choice
        options:
          - 'mce'
          - 'ucm'
          - 'both'
      health_check:
        description: 'Run health check only'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: false
        type: boolean

# Prevent concurrent runs
concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  # Health Check Job (runs first)
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --omit=dev
      
      - name: Run System Health Check
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Running system health checks..."
          
          # Check MCE health
          if npx tsx scripts/prod/mce-pipeline.ts --health; then
            echo "MCE health: PASS"
            MCE_HEALTHY=true
          else
            echo "MCE health: FAIL"
            MCE_HEALTHY=false
          fi
          
          # Check UCM health  
          if npx tsx scripts/prod/ucm-pipeline.ts --health; then
            echo "UCM health: PASS"
            UCM_HEALTHY=true
          else
            echo "UCM health: FAIL"
            UCM_HEALTHY=false
          fi
          
          # Overall health
          if [ "$MCE_HEALTHY" = "true" ] && [ "$UCM_HEALTHY" = "true" ]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "✅ All systems healthy"
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "❌ System health check failed"
            exit 1
          fi

  # MCE Pipeline Job
  mce-pipeline:
    runs-on: ubuntu-latest
    needs: health-check
    if: |
      (github.event_name == 'schedule' || 
       github.event.inputs.pipeline == 'mce' || 
       github.event.inputs.pipeline == 'both') &&
      (github.event.inputs.health_check != 'true') &&
      needs.health-check.outputs.healthy == 'true'
    timeout-minutes: 3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --omit=dev
      
      - name: Run MCE Production Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CMD="npx tsx scripts/prod/mce-pipeline.ts"
          
          if [ "${{ github.event.inputs.verbose || 'false' }}" = "true" ]; then
            CMD="$CMD --verbose"
          fi
          
          echo "🚀 Running MCE Production Pipeline: $CMD"
          $CMD

  # UCM Pipeline Job  
  ucm-pipeline:
    runs-on: ubuntu-latest
    needs: [health-check, mce-pipeline]
    if: |
      (github.event_name == 'schedule' || 
       github.event.inputs.pipeline == 'ucm' || 
       github.event.inputs.pipeline == 'both') &&
      (github.event.inputs.health_check != 'true') &&
      needs.health-check.outputs.healthy == 'true' &&
      (always() && (needs.mce-pipeline.result == 'success' || needs.mce-pipeline.result == 'skipped'))
    timeout-minutes: 3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --omit=dev
      
      - name: Run UCM Production Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UCM_ADMIN_TOKEN: ${{ secrets.UCM_ADMIN_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CMD="npx tsx scripts/prod/ucm-pipeline.ts"
          
          if [ "${{ github.event.inputs.verbose || 'false' }}" = "true" ]; then
            CMD="$CMD --verbose"
          fi
          
          echo "🎯 Running UCM Production Pipeline: $CMD"
          $CMD

  # Failure Recovery Job
  failure-recovery:
    runs-on: ubuntu-latest
    needs: [health-check, mce-pipeline, ucm-pipeline]
    if: failure()
    timeout-minutes: 2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --omit=dev
      
      - name: Diagnostic Health Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🚨 Pipeline failure detected, running diagnostics..."
          
          echo "📊 MCE Health Check:"
          npx tsx scripts/prod/mce-pipeline.ts --health --verbose || true
          
          echo "📊 UCM Health Check:"  
          npx tsx scripts/prod/ucm-pipeline.ts --health --verbose || true
          
          echo "📊 System Health API:"
          curl -f https://tradelia-core.vercel.app/api/health || echo "Health API failed"
      
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-logs-${{ github.run_number }}
          path: |
            /home/runner/.npm/_logs/
            /tmp/*.log
          retention-days: 7