<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout and Service Worker Fix Test</title>
</head>
<body>
    <h1>Testing Layout and Service Worker Fixes</h1>
    
    <h2>Root Layout Test</h2>
    <p>Visit <a href="http://localhost:3000/nonexistent-page" target="_blank">http://localhost:3000/nonexistent-page</a></p>
    <p>Should show 404 without "root layout" error</p>
    
    <h2>Service Worker Test</h2>
    <p>Check console for service worker registration status</p>
    <div id="sw-status">Testing...</div>
    
    <script>
        // Test service worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', {
                scope: '/',
                updateViaCache: 'none'
            })
            .then(registration => {
                document.getElementById('sw-status').innerHTML = '✅ Service Worker registered successfully';
                console.log('✅ SW registered:', registration.scope);
            })
            .catch(error => {
                document.getElementById('sw-status').innerHTML = '❌ Service Worker registration failed: ' + error.message;
                console.error('❌ SW registration failed:', error);
            });
        } else {
            document.getElementById('sw-status').innerHTML = '❌ Service Worker not supported';
        }
        
        // Test if sw.js is accessible
        fetch('/sw.js')
            .then(response => {
                if (response.ok) {
                    console.log('✅ sw.js accessible, Content-Type:', response.headers.get('content-type'));
                } else {
                    console.error('❌ sw.js not accessible:', response.status);
                }
            })
            .catch(error => {
                console.error('❌ sw.js fetch error:', error);
            });
    </script>
</body>
</html>
