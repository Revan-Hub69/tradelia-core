<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Install Test - Tradelia</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #console {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 PWA Install Test - Tradelia</h1>
    
    <div class="status success">
        <strong>✅ Test Page Loaded</strong><br>
        This page will test PWA installation capabilities.
    </div>

    <h2>🎯 Actions</h2>
    <button onclick="runDiagnostic()">Run PWA Diagnostic</button>
    <button onclick="triggerInstall()" id="installBtn" disabled>Install PWA</button>
    <button onclick="clearConsole()">Clear Console</button>

    <h2>📋 Console Output</h2>
    <div id="console"></div>

    <script>
        let deferredPrompt;
        const consoleDiv = document.getElementById('console');
        const installBtn = document.getElementById('installBtn');

        // Override console.log to show in page
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleDiv.textContent += args.join(' ') + '\n';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        function clearConsole() {
            consoleDiv.textContent = '';
        }

        // Listen for PWA install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('🎉 PWA Install Prompt Available!');
            deferredPrompt = e;
            e.preventDefault();
            installBtn.disabled = false;
            installBtn.textContent = 'Install PWA Now';
        });

        // Listen for PWA installation
        window.addEventListener('appinstalled', () => {
            console.log('✅ PWA Installed Successfully!');
            deferredPrompt = null;
            installBtn.disabled = true;
            installBtn.textContent = 'PWA Installed';
        });

        function triggerInstall() {
            if (deferredPrompt) {
                console.log('🚀 Triggering PWA Install...');
                deferredPrompt.prompt();
                
                deferredPrompt.userChoice.then((choiceResult) => {
                    console.log('👤 User choice:', choiceResult.outcome);
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User accepted the install prompt');
                    } else {
                        console.log('❌ User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                console.log('❌ No install prompt available');
            }
        }

        function runDiagnostic() {
            console.log('🔍 PWA Install Diagnostic Starting...\n');

            // Check 1: Manifest validation
            console.log('1. 📋 MANIFEST VALIDATION');
            fetch('/manifest.json')
                .then(response => response.json())
                .then(manifest => {
                    console.log('✅ Manifest loaded successfully');
                    console.log('📍 Start URL:', manifest.start_url);
                    console.log('📱 Display mode:', manifest.display);
                    console.log('🎨 Theme color:', manifest.theme_color);
                    console.log('🖼️ Icons count:', manifest.icons?.length || 0);
                    
                    // Check for required fields
                    const required = ['name', 'start_url', 'display', 'icons'];
                    const missing = required.filter(field => !manifest[field]);
                    
                    if (missing.length > 0) {
                        console.log('❌ Missing required fields:', missing.join(', '));
                    } else {
                        console.log('✅ All required manifest fields present');
                    }
                    
                    // Check icon requirements
                    const hasValidIcons = manifest.icons?.some(icon => {
                        const size = parseInt(icon.sizes);
                        return size >= 192;
                    });
                    
                    if (hasValidIcons) {
                        console.log('✅ Valid icons (192px+) found');
                    } else {
                        console.log('❌ No valid icons found (need 192px+)');
                    }
                })
                .catch(error => {
                    console.log('❌ Manifest loading failed:', error.message);
                });

            // Check 2: Service Worker status
            console.log('\n2. ⚙️ SERVICE WORKER STATUS');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    if (registrations.length > 0) {
                        console.log('✅ Service Worker registered');
                        registrations.forEach((registration, index) => {
                            console.log(`   SW ${index + 1}:`, registration.scope);
                            console.log('   State:', registration.active?.state || 'inactive');
                        });
                    } else {
                        console.log('❌ No Service Worker registered');
                    }
                });
            } else {
                console.log('❌ Service Worker not supported');
            }

            // Check 3: HTTPS requirement
            console.log('\n3. 🔒 HTTPS VALIDATION');
            if (location.protocol === 'https:' || location.hostname === 'localhost') {
                console.log('✅ Secure context (HTTPS or localhost)');
            } else {
                console.log('❌ Not secure context - PWA requires HTTPS');
            }

            // Check 4: User engagement
            console.log('\n4. 👤 USER ENGAGEMENT');
            const visitCount = localStorage.getItem('pwa-visit-count') || 0;
            const newCount = parseInt(visitCount) + 1;
            localStorage.setItem('pwa-visit-count', newCount.toString());

            console.log('📊 Visit count:', newCount);
            if (newCount >= 2) {
                console.log('✅ Sufficient user engagement (2+ visits)');
            } else {
                console.log('⚠️ May need more user engagement (visit again)');
            }

            // Check 5: Browser compatibility
            console.log('\n5. 🌐 BROWSER COMPATIBILITY');
            const userAgent = navigator.userAgent;
            const isChrome = userAgent.includes('Chrome');
            const isSafari = userAgent.includes('Safari') && !userAgent.includes('Chrome');
            const isFirefox = userAgent.includes('Firefox');
            const isEdge = userAgent.includes('Edge');

            console.log('🔍 Browser detected:');
            if (isChrome) console.log('  ✅ Chrome - Full PWA support');
            if (isEdge) console.log('  ✅ Edge - Full PWA support');
            if (isSafari) console.log('  ⚠️ Safari - Limited PWA support (use Share > Add to Home Screen)');
            if (isFirefox) console.log('  ⚠️ Firefox - Basic PWA support');

            // Summary
            setTimeout(() => {
                console.log('\n📋 DIAGNOSTIC COMPLETE');
                console.log('💡 If install prompt doesn\'t appear:');
                console.log('1. Visit this page multiple times');
                console.log('2. Ensure you\'re on HTTPS or localhost');
                console.log('3. Check Chrome DevTools > Application > Manifest');
                console.log('4. Try in Chrome or Edge for best support');
            }, 2000);
        }

        // Auto-run diagnostic on page load
        setTimeout(runDiagnostic, 1000);
    </script>
</body>
</html>
