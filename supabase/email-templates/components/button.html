<!-- 
  CTA Button Component
  
  Reusable call-to-action button with Tradelia brand styling.
  Supports Go template variables for dynamic href values.
  Includes glass effect styling (box-shadow, border).
  Ensures 44x44px minimum touch target for mobile accessibility.
  
  Usage: Replace {{.ConfirmationURL}} with appropriate Supabase template variable
  Examples: {{.ConfirmationURL}}, {{.SiteURL}}, custom URLs
  
  Requirements: 4.3, 4.4
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding: 20px 0;">
      <a href="{{.ConfirmationURL}}" style="display: inline-block; background: #1D4ED8; color: white; padding: 14px 32px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 16px; min-height: 44px; min-width: 44px; line-height: 16px; box-shadow: 0 4px 6px rgba(29, 78, 216, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
        {{.CTAText}}
      </a>
    </td>
  </tr>
</table>
