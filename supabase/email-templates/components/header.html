<!-- 
  Tradelia Email Header Component
  
  This component provides a branded header with the Tradelia logo and gradient background.
  Uses inline SVG to avoid external image dependencies.
  
  Requirements: 4.1, 4.2, 5.4, 5.5
-->
<tr>
  <td style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px 20px; text-align: center; border-radius: 10px 10px 0 0;">
    <!-- Tradelia Logo SVG (inline to avoid external image requests) -->
    <svg width="40" height="40" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="display: inline-block;" role="img" aria-label="Tradelia Logo">
      <rect width="32" height="32" rx="8" fill="#1D4ED8"/>
      <path d="M8 11h16M16 11v12" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="11" r="2" fill="#059669"/>
    </svg>
    <!-- Brand Name -->
    <h1 style="color: white; margin: 10px 0 0 0; font-size: 24px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">Tradelia</h1>
  </td>
</tr>
