<!-- 
  Language Navigation Component
  
  Provides anchor links to jump to English or Italian sections within the email.
  Uses standard HTML anchor links (no JavaScript required).
  Touch-friendly buttons with 44x44px minimum touch target.
  
  Requirements: 1.4, 2.1, 2.3, 2.4, 2.5
-->
<tr>
  <td style="background: #ffffff; padding: 20px; text-align: center; border-bottom: 1px solid #e5e7eb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <!-- English Navigation Button -->
          <a href="#en" style="display: inline-block; background: #1D4ED8; color: white; padding: 12px 24px; margin: 0 8px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; min-height: 44px; min-width: 44px; line-height: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">🇬🇧 English</a>
          <!-- Italian Navigation Button -->
          <a href="#it" style="display: inline-block; background: #1D4ED8; color: white; padding: 12px 24px; margin: 0 8px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; min-height: 44px; min-width: 44px; line-height: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">🇮🇹 Italiano</a>
        </td>
      </tr>
    </table>
  </td>
</tr>
